name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tests and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM + Robolectric database tests)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Print exported Room schema (commit it to app/schemas)
        run: |
          for f in app/schemas/*/*.json; do echo "=== $f"; cat "$f"; echo; echo "=== end"; done

      - name: Android lint (report only)
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SalonManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (unsigned unless a keystore is configured)
        uses: actions/upload-artifact@v4
        with:
          name: SalonManager-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload exported Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  device:
    name: Install and run on Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Install, launch and run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-smoke-test.sh

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-reports-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
