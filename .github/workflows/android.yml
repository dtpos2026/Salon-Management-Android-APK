name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tests and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure signing key and Firebase from secrets
        run: bash .github/scripts/configure-secrets.sh
        env:
          DT_KEYSTORE_BASE64: ${{ secrets.DT_KEYSTORE_BASE64 }}
          DT_SIGNING_PASSWORD: ${{ secrets.DT_SIGNING_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Unit tests (JVM + Robolectric database tests)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      # Room writes the schema as a side effect of KSP, which the build cache can skip,
      # so re-run KSP without the cache. Any change means an entity changed without a
      # committed schema (and usually without a version bump and migration).
      - name: Check the committed Room schema is up to date
        run: |
          ./gradlew :app:kspDebugKotlin --rerun --no-build-cache
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            git diff app/schemas
            echo "::error::The database schema changed. Bump SalonDatabase.VERSION, add a migration and commit app/schemas."
            exit 1
          fi
          echo "Committed Room schema matches the entities."

      - name: Android lint (report only)
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SalonManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (signed when the signing secrets are set)
        uses: actions/upload-artifact@v4
        with:
          name: SalonManager-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload exported Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: app/schemas/

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  device:
    name: Install and run on Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Configure signing key and Firebase from secrets
        run: bash .github/scripts/configure-secrets.sh
        env:
          DT_KEYSTORE_BASE64: ${{ secrets.DT_KEYSTORE_BASE64 }}
          DT_SIGNING_PASSWORD: ${{ secrets.DT_SIGNING_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Install, launch and run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/device-smoke-test.sh

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-reports-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
