name: Clean up caches and old artifacts

# GitHub Actions storage is limited. This keeps only the newest caches and the artifacts of the
# newest runs. Caches of other branches are evicted by GitHub after 7 days without use.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Android CI']
    types: [completed]
  push:
    paths:
      - .github/workflows/cleanup.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP_CACHES: 2
      KEEP_RUNS: 2
      KEEP_WORKFLOW_RUNS: 6
    steps:
      - name: Storage before
        run: |
          gh api "repos/$REPO/actions/cache/usage" --jq '"Caches: \(.active_caches_count), \(.active_caches_size_in_bytes/1048576|floor) MB"'

      - name: Delete all but the newest caches
        run: |
          gh api "repos/$REPO/actions/caches?per_page=1" --jq '"Caches API total_count: \(.total_count)"'
          # The debug signing key (dt-debug-keystore-*) is tiny and is never deleted: without it
          # the next APK would not install over the previous one.
          ids=$(gh cache list --repo "$REPO" --limit 1000 --sort last_accessed_at --order desc --json id,key \
            --jq '.[] | select(.key | startswith("dt-debug-keystore") | not) | .id')
          echo "Found $(echo "$ids" | grep -c . || true) caches (besides the signing key); keeping the newest $KEEP_CACHES."
          echo "$ids" | tail -n +$((KEEP_CACHES + 1)) | while read -r id; do
            [ -n "$id" ] || continue
            gh cache delete "$id" --repo "$REPO" && echo "deleted cache $id"
          done

      - name: Keep artifacts of the newest runs only
        run: |
          # Artifacts (APKs, screenshots, reports) count against the account's storage. Keep those of
          # the newest $KEEP_RUNS runs (newest APK stays downloadable) and delete the rest.
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.workflow_run.id) \(.id)"' > artifacts.txt
          echo "Artifacts before: $(wc -l < artifacts.txt)"
          keep=$(cut -d' ' -f1 artifacts.txt | awk '!seen[$0]++' | head -n "$KEEP_RUNS")
          while read -r run id; do
            [ -n "$id" ] || continue
            if ! grep -qx "$run" <<< "$keep"; then
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null && echo "deleted artifact $id (run $run)"
            fi
          done < artifacts.txt
          echo "Artifacts left: $(gh api "repos/$REPO/actions/artifacts?per_page=1" --jq .total_count)"

      - name: Delete old workflow runs
        run: |
          # Keeps the newest $KEEP_WORKFLOW_RUNS finished runs (with their logs); older ones are
          # deleted. Runs that are queued or in progress are never touched.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100&status=completed" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' \
            | tail -n +$((KEEP_WORKFLOW_RUNS + 1)) | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && echo "deleted run $id"
            done
          echo "Runs left: $(gh api "repos/$REPO/actions/runs?per_page=1" --jq .total_count)"

      - name: Storage after
        run: |
          gh api "repos/$REPO/actions/cache/usage" --jq '"Caches: \(.active_caches_count), \(.active_caches_size_in_bytes/1048576|floor) MB"'
