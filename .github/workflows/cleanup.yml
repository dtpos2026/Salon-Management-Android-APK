name: Clean up caches and old artifacts

# GitHub Actions storage is limited. This keeps only the newest Gradle caches and deletes
# build artifacts (APKs, screenshots, reports) older than a few days.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Android CI']
    types: [completed]
  push:
    paths:
      - .github/workflows/cleanup.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP_CACHES: 2
      ARTIFACT_DAYS: 3
    steps:
      - name: Storage before
        run: |
          gh api "repos/$REPO/actions/cache/usage" --jq '"Caches: \(.active_caches_count), \(.active_caches_size_in_bytes/1048576|floor) MB"'

      - name: Delete all but the newest caches
        run: |
          gh api "repos/$REPO/actions/caches?per_page=1" --jq '"Caches API total_count: \(.total_count)"'
          ids=$(gh cache list --repo "$REPO" --limit 1000 --sort last_accessed_at --order desc --json id --jq '.[].id')
          echo "Found $(echo "$ids" | grep -c . || true) caches; keeping the newest $KEEP_CACHES."
          echo "$ids" | tail -n +$((KEEP_CACHES + 1)) | while read -r id; do
            [ -n "$id" ] || continue
            gh cache delete "$id" --repo "$REPO" && echo "deleted cache $id"
          done

      - name: Delete artifacts older than a few days
        run: |
          cutoff=$(date -u -d "-${ARTIFACT_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null && echo "deleted artifact $id"
            done
          echo "Artifacts left: $(gh api "repos/$REPO/actions/artifacts?per_page=1" --jq .total_count)"

      - name: Storage after
        run: |
          gh api "repos/$REPO/actions/cache/usage" --jq '"Caches: \(.active_caches_count), \(.active_caches_size_in_bytes/1048576|floor) MB"'
