org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# --- Commercial licensing (see docs/LICENSING.md) -------------------------------------------
# Enforce license expiry (read-only mode after expiry). Off for the owner's own build.
salon.enforceLicense=false
# Trial length (days) used when enforcement is on and no license key was entered.
salon.trialDays=30
